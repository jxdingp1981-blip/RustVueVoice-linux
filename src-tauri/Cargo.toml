[package]
name = "rustvuevoice"
version = "1.0.0"
edition = "2021"
description = "Rulink/MR08 智能语音鼠标 · RustVueVoice（Tauri 2 + Vue 3 版，豆包云端引擎）"

[[bin]]
name = "RustVueVoice"
path = "src/main.rs"

[features]
# 生产构建必须启用（内嵌前端 dist 资源，替代 devUrl 的 localhost 端口）。
# `cargo tauri build` / `npm run tauri build` 会自动带上；手动构建请用：
#   cargo build --release --features tauri/custom-protocol
custom-protocol = ["tauri/custom-protocol"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["image-png"] }
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt", "sync", "time", "net", "macros"] }
tokio-tungstenite = { version = "0.28", features = ["native-tls"] }
futures-util = { version = "0.3", default-features = false, features = ["sink", "std"] }
http = "1"
base64 = "0.22"
rusqlite = { version = "0.37", features = ["bundled"] }
aes-gcm = "0.10"
native-tls = "0.2"
uuid = { version = "1", features = ["v4"] }
url = "2"
flate2 = "1"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_Input",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_HiDpi",
    "Win32_Graphics_Gdi",
    "Win32_Graphics_GdiPlus",
    "Win32_Devices_HumanInterfaceDevice",
    "Win32_Devices_DeviceAndDriverInstallation",
    "Win32_Storage_FileSystem",
    "Win32_System_IO",
    "Win32_System_Threading",
    "Win32_System_Registry",
    "Win32_System_Memory",
    "Win32_System_DataExchange",
    "Win32_System_LibraryLoader",
    "Win32_System_Console",
    "Win32_System_SystemServices",
    "Win32_System_SystemInformation",
    "Win32_System_Time",
    "Win32_UI_Shell",
    "Win32_Security",
    "Win32_Security_Cryptography",
] }

# ---- Linux 平台层（Arch 移植）----
# x11rb:悬浮胶囊窗口 + XShape 点击穿透;cairo:胶囊绘制(等价 GDI+)
[target.'cfg(not(windows))'.dependencies]
libc = "0.2"
x11rb = { version = "0.14", features = ["shape", "randr"] }
cairo-rs = { version = "0.22", default-features = false }
# 剪贴板:X11(x11rb 后端,经 XWayland 兼容 Wayland)+ Wayland data-control 协议
arboard = { version = "3", default-features = false, features = ["wayland-data-control"] }
# Linux Chromium cookie 解密:v10=PBKDF2+AES-128-CBC;v11=keyring(Secret Service/KWallet)
aes = "0.9"
cbc = "0.2"
pbkdf2 = { version = "0.13", default-features = false, features = ["hmac"] }
hmac = "0.13"
sha1 = "0.11"
keyring = "4"

[profile.release]
opt-level = 2
lto = true
codegen-units = 1
strip = true
panic = "abort"
